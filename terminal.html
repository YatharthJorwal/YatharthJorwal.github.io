<style>
:root{--bg:#0a1626;--panel:#0f2137;--fg:#d6e4ee;--dim:#7d94a8;--teal:#22d3c5;--yel:#f6c945;--red:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;max-width:860px;margin:0 auto;padding:12px}
#bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-radius:8px 8px 0 0;color:var(--dim);font-size:13px}
#bar i{width:10px;height:10px;border-radius:50%;background:var(--dim);opacity:.5}
#bar span{margin-left:8px}
#term{flex:1;overflow-y:auto;background:var(--panel);padding:12px 16px;border-top:1px solid #1b3350;cursor:text}
.line{white-space:pre-wrap;word-break:break-word;margin:0}
.dim{color:var(--dim)}.t{color:var(--teal)}.y{color:var(--yel)}.r{color:var(--red)}
a{color:var(--teal);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
#row{display:flex;gap:8px;align-items:center;margin-top:6px}
#row label{color:var(--teal);white-space:nowrap}
#in{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;caret-color:var(--yel)}
#in:focus{outline:none}
#chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:var(--panel);border-radius:0 0 8px 8px;border-top:1px solid #1b3350}
#chips button{background:none;border:1px solid #2a4a6b;color:var(--fg);font:inherit;font-size:13px;padding:4px 10px;border-radius:6px;cursor:pointer}
#chips button:hover{border-color:var(--teal);color:var(--teal)}
.reels{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.reel{flex:1 1 180px;border:1px solid var(--teal);border-radius:6px;padding:8px 10px;background:#0a1626}
.reel small{display:block;color:var(--dim);font-size:12px}
.reel b{display:block;color:var(--yel);font-weight:600;min-height:1.6em}
.reel.done b{color:var(--teal)}
.reel.done{animation:pop .25s ease-out}
@keyframes pop{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.reel.done{animation:none}}
@media (max-width:520px){body{padding:6px;font-size:14px}}
</style>

const wait = ms => new Promise(r => setTimeout(r, ms));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function print(html, cls = '') {
  const p = document.createElement('p');
  p.className = 'line ' + cls;
  p.innerHTML = html;
  term.insertBefore(p, row);
  term.scrollTop = term.scrollHeight;

const POOLS = {
  stack: ['vanilla JS', 'Canvas', 'Web Audio', 'pure CSS', 'inline SVG', 'one HTML file', 'Apps Script', 'the DOM, abused'],
  build: ['a tiny game', 'a useless tool', 'a visualizer', 'a dev joke', 'a widget for client sites', 'a browser toy', 'a fake OS window'],
  twist: ['no libraries', 'under 100 lines', 'works offline', 'one keyboard shortcut only', 'hides an easter egg', 'a dark mode nobody asked for']
};
const pick = a => a[Math.floor(Math.random() * a.length)];

async function roulette() {
  const wrap = document.createElement('div');
  wrap.className = 'reels';
  const keys = ['stack', 'build', 'twist'];
  const labels = { stack: 'use', build: 'make', twist: 'rule' };
  const els = keys.map(k => {
    const d = document.createElement('div');
    d.className = 'reel';
    d.innerHTML = `<small>${labels[k]}</small><b>...</b>`;
    wrap.appendChild(d);
    return d;
  });
  term.insertBefore(wrap, row);
  const result = {};
  await Promise.all(keys.map(async (k, i) => {
    const b = els[i].querySelector('b');
    const stopAt = Date.now() + (reduce ? 0 : 800 + i * 550);
    while (Date.now() < stopAt) { b.textContent = pick(POOLS[k]); await wait(70); }
    result[k] = pick(POOLS[k]);
    b.textContent = result[k];
    els[i].classList.add('done');
  }));
  print(`<span class="y">Today's commit:</span> make ${result.build} using ${result.stack}, ${result.twist}.`);
  print(`<span class="dim">git commit -m "add ${result.build.replace(/^an? /, '')} (${result.stack}, ${result.twist})"</span>`);
  print('Type <span class="t">roulette</span> to spin again.', 'dim');
}

    const r = document.documentElement.style;

  matrix() {
    if (reduce) { print('matrix skipped: your device asks for reduced motion.', 'dim'); return; }
    return new Promise(done => {
      const c = document.createElement('canvas');
      c.style.cssText = 'position:fixed;inset:0;z-index:9;cursor:pointer';
      c.width = innerWidth; c.height = innerHeight;
      document.body.appendChild(c);
      const x = c.getContext('2d');
      const css = getComputedStyle(document.documentElement);
      const bg = css.getPropertyValue('--bg'), fg = css.getPropertyValue('--teal');
      const drops = Array.from({ length: Math.floor(c.width / 16) }, () => Math.random() * -40);
      let on = true;
      const stop = () => { if (!on) return; on = false; c.remove(); print('Wake up, visitor. Type <span class="t">help</span>.', 'dim'); done(); };
      c.onclick = stop;
      setTimeout(stop, 6000);
      (function frame() {
        if (!on) return;
        x.globalAlpha = .15; x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height);
        x.globalAlpha = 1; x.fillStyle = fg; x.font = '16px monospace';
        drops.forEach((d, i) => {
          x.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), i * 16, d * 16);
          drops[i] = d * 16 > c.height && Math.random() > .975 ? 0 : d + 1;
        });
        setTimeout(() => requestAnimationFrame(frame), 40);
      })();
    });
  },
  async hack() {
    const steps = ['Scanning ports', 'Bypassing firewall', 'Decrypting mainframe', 'Downloading everything'];
    for (const st of steps) {

      for (let i = 0; i <= 10; i++) {

    print('<span class="r">ACCESS DENIED.</span>');
    await wait(reduce ? 0 : 500);

    const hops = [['1', 'we chat on WhatsApp'], ['3', 'you see a live preview'], ['5', 'your site goes live']];
    for (const [d, m] of hops) {

<span class="y">7e21b60</span> add reviews section, remove my ego

  snake() {
    return new Promise(done => {
      const N = 20;
      const size = Math.max(200, Math.floor(Math.min(innerWidth - 24, innerHeight - 160, 400) / N) * N);
      const cs = size / N;
      const css = getComputedStyle(document.documentElement);
      const bg = css.getPropertyValue('--bg').trim(), fg = css.getPropertyValue('--teal').trim(), gold = css.getPropertyValue('--yel').trim(), dim = css.getPropertyValue('--dim').trim();
      const wrap = document.createElement('div');
      wrap.style.cssText = `position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:${bg};touch-action:none`;
      const info = document.createElement('div');
      info.style.color = gold;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      c.style.border = `1px solid ${fg}`;
      const hint = document.createElement('div');
      hint.style.cssText = `color:${dim};font-size:13px`;
      hint.textContent = 'Arrows, WASD or swipe. Esc to quit.';
      wrap.append(info, c, hint);
      document.body.appendChild(wrap);
      const x = c.getContext('2d');

      let best = 0;
      try { best = +localStorage.getItem('snake') || 0; } catch (e) {}
      let body = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      let dir = { x: 1, y: 0 }, next = dir, score = 0, over = false;
      const spawn = () => {
        let p;
        do { p = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
        while (body.some(b => b.x === p.x && b.y === p.y));
        return p;
      };
      let food = spawn();

      const draw = () => {
        x.fillStyle = bg; x.fillRect(0, 0, size, size);
        x.fillStyle = gold; x.fillRect(food.x * cs + 2, food.y * cs + 2, cs - 4, cs - 4);
        body.forEach((b, i) => { x.fillStyle = i ? fg : '#ffffff'; x.fillRect(b.x * cs + 1, b.y * cs + 1, cs - 2, cs - 2); });
        info.textContent = `score ${score}   best ${best}`;
      };
      const close = () => {
        clearInterval(timer);
        document.removeEventListener('keydown', onKey, true);
        wrap.remove();
        print(`snake: scored <span class="y">${score}</span>${score && score >= best ? ' <span class="t">(new best!)</span>' : ''}. Type <span class="t">snake</span> to go again.`);
        done();
      };
      const end = () => {
        over = true; clearInterval(timer);
        if (score > best) { best = score; try { localStorage.setItem('snake', best); } catch (e) {} }
        draw();
        x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, 0, size, size);
        x.fillStyle = '#fff'; x.textAlign = 'center'; x.font = '600 20px monospace';
        x.fillText('game over', size / 2, size / 2 - 6);
        x.font = '14px monospace';
        x.fillText('Enter or tap to close', size / 2, size / 2 + 18);
        c.onclick = close;
      };
      const tick = () => {
        dir = next;
        const h = { x: body[0].x + dir.x, y: body[0].y + dir.y };
        if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some(b => b.x === h.x && b.y === h.y)) return end();
        body.unshift(h);
        if (h.x === food.x && h.y === food.y) { score++; food = spawn(); } else body.pop();
        draw();
      };
      const turn = (nx, ny) => { if (nx !== -dir.x || ny !== -dir.y) next = { x: nx, y: ny }; };
      const KEYS = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
      const onKey = e => {
        if (e.key === 'Escape' || (over && e.key === 'Enter')) { e.preventDefault(); return close(); }
        const k = KEYS[e.key] || KEYS[e.key.toLowerCase()];
        if (k && !over) { e.preventDefault(); turn(k[0], k[1]); }
      };
      document.addEventListener('keydown', onKey, true);
      let t0;
      wrap.addEventListener('touchstart', e => { t0 = e.touches[0]; }, { passive: true });
      wrap.addEventListener('touchend', e => {
        if (!t0 || over) return;
        const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
      });
      draw();
      const timer = setInterval(tick, 110);
    });
  },

const names = Object.keys(CMDS);
const hist = []; let hi = 0; let busy = false;

// prompt row
const row = document.createElement('div');
row.id = 'row';
row.innerHTML = '<label for="in">visitor@webs:~$</label><input id="in" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Command">';
term.appendChild(row);
const input = row.querySelector('input');

async function run(raw) {
  const cmd = raw.trim().toLowerCase();
  if (!cmd) return;
  hist.push(cmd); hi = hist.length;
  const echo = print('<span class="t">visitor@webs:~$</span> ');
  echo.appendChild(document.createTextNode(raw));
  busy = true; input.disabled = true;
  try {
    const [head, ...rest] = raw.trim().split(/\s+/);
    const name = head.toLowerCase();
    if (Object.hasOwn(CMDS, cmd)) await CMDS[cmd]();
    else if (Object.hasOwn(CMDS, name)) await CMDS[name](rest.join(' '));
    else print(`command not found: <span class="r"></span>. Type <span class="t">help</span>.`).querySelector('.r').textContent = cmd;
  } finally {
    busy = false; input.disabled = false; input.focus();
    term.scrollTop = term.scrollHeight;
  }
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const v = input.value; input.value = ''; run(v); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (hi > 0) input.value = hist[--hi]; }
  else if (e.key === 'ArrowDown') { e.preventDefault(); hi = Math.min(hi + 1, hist.length); input.value = hist[hi] || ''; }
  else if (e.key === 'Tab') {
    e.preventDefault();
    const m = names.filter(n => n.startsWith(input.value.toLowerCase()));
    if (m.length === 1) input.value = m[0];
  } else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); CMDS.clear(); }
});

['about', 'projects', 'pricing', 'contact', 'roulette', 'neofetch', 'theme', 'matrix', 'snake', 'exit', 'help'].forEach(n => {
  const b = document.createElement('button');
  b.textContent = n;
  b.onclick = () => { if (!busy) run(n); };
  chips.appendChild(b);
});
term.addEventListener('click', e => { if (!getSelection().toString() && e.target.tagName !== 'A') input.focus(); });

try { const t = localStorage.getItem('theme'); if (t) { CMDS.theme(t); [...term.querySelectorAll('.line')].pop().remove(); } } catch (e) {}
print('<span class="y">Yatharth Webs</span> terminal. Type <span class="t">help</span> for a lot more commands, or hit <span class="t">roulette</span> to get something to build.');
input.focus();
</script>
</body>
</html>
