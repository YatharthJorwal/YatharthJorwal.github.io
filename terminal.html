function print(html, cls = '') {
  const p = document.createElement('p');
  p.className = 'line ' + cls;
  p.innerHTML = html;
  term.insertBefore(p, row);
  term.scrollTop = term.scrollHeight;

const POOLS = {
  stack: ['vanilla JS', 'Canvas', 'Web Audio', 'pure CSS', 'inline SVG', 'one HTML file', 'Apps Script', 'the DOM, abused'],
  build: ['a tiny game', 'a useless tool', 'a visualizer', 'a dev joke', 'a widget for client sites', 'a browser toy', 'a fake OS window'],
  twist: ['no libraries', 'under 100 lines', 'works offline', 'one keyboard shortcut only', 'hides an easter egg', 'a dark mode nobody asked for']
};
const pick = a => a[Math.floor(Math.random() * a.length)];

async function roulette() {
  const wrap = document.createElement('div');
  wrap.className = 'reels';
  const keys = ['stack', 'build', 'twist'];
  const labels = { stack: 'use', build: 'make', twist: 'rule' };
  const els = keys.map(k => {
    const d = document.createElement('div');
    d.className = 'reel';
    d.innerHTML = `<small>${labels[k]}</small><b>...</b>`;
    wrap.appendChild(d);
    return d;
  });
  term.insertBefore(wrap, row);
  const result = {};
  await Promise.all(keys.map(async (k, i) => {
    const b = els[i].querySelector('b');
    const stopAt = Date.now() + (reduce ? 0 : 800 + i * 550);
    while (Date.now() < stopAt) { b.textContent = pick(POOLS[k]); await wait(70); }
    result[k] = pick(POOLS[k]);
    b.textContent = result[k];
    els[i].classList.add('done');
  }));
  print(`<span class="y">Today's commit:</span> make ${result.build} using ${result.stack}, ${result.twist}.`);
  print(`<span class="dim">git commit -m "add ${result.build.replace(/^an? /, '')} (${result.stack}, ${result.twist})"</span>`);
  print('Type <span class="t">roulette</span> to spin again.', 'dim');
}

function printText(t, cls = '') { const p = print('', cls); p.textContent = t; return p; }
const DIRS = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
let mode = null;

/* full-screen canvas game shell: restart + exit buttons, keys, swipe, tap */
function arcade(name, hint, cols, rows, game) {
  input.blur();
  return new Promise(done => {
    const cs = getComputedStyle(document.documentElement);
    const C = { bg: cs.getPropertyValue('--bg').trim(), fg: cs.getPropertyValue('--teal').trim(), gold: cs.getPropertyValue('--yel').trim(), dim: cs.getPropertyValue('--dim').trim() };
    const wrap = document.createElement('div');
    wrap.style.cssText = `position:fixed;inset:0;height:100dvh;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:${C.bg};touch-action:none;user-select:none;-webkit-user-select:none`;
    const u = Math.max(8, Math.floor(Math.min((innerWidth - 24) / cols, (innerHeight - 200) / rows, 22)));
    const W = cols * u, H = rows * u, dpr = Math.min(devicePixelRatio || 1, 2);
    const info = document.createElement('div'); info.style.color = C.gold;
    const c = document.createElement('canvas');
    c.width = W * dpr; c.height = H * dpr;
    c.style.cssText = `width:${W}px;height:${H}px;border:1px solid ${C.fg}`;
    const x = c.getContext('2d'); x.scale(dpr, dpr);
    const hintEl = document.createElement('div');
    hintEl.style.cssText = `color:${C.dim};font-size:13px;text-align:center;padding:0 12px`;
    hintEl.textContent = hint;
    const bar = document.createElement('div'); bar.style.cssText = 'display:flex;gap:10px';
    const btn = (t, f) => { const b = document.createElement('button'); b.textContent = t; b.style.cssText = `font:inherit;font-size:15px;padding:10px 20px;border-radius:8px;border:1px solid ${C.fg};background:none;color:${C.fg};cursor:pointer`; b.onclick = f; bar.appendChild(b); };
    btn('restart', () => start()); btn('exit', () => quit());
    wrap.append(info, c, hintEl, bar); document.body.appendChild(wrap);

    let timer = 0, over = false;
    const g = { x, u, W, H, C, key: null, tap: null, swipe: null, result: '',
      info: t => { info.textContent = t; },
      loop: (ms, fn) => { clearInterval(timer); timer = setInterval(fn, ms); },
      end: msg => {
        over = true; clearInterval(timer);
        x.fillStyle = 'rgba(0,0,0,.65)'; x.fillRect(0, 0, W, H);
        x.fillStyle = '#fff'; x.textAlign = 'center'; x.font = '600 20px monospace'; x.fillText('game over', W / 2, H / 2 - 10);
        x.font = '13px monospace'; x.fillText(msg, W / 2, H / 2 + 12); x.fillText('tap or press Enter to restart', W / 2, H / 2 + 32);
      } };
    function start() { clearInterval(timer); over = false; g.key = g.tap = g.swipe = null; x.textAlign = 'left'; game(g); }
    function quit() {
      clearInterval(timer); document.removeEventListener('keydown', onKey, true); wrap.remove();
      print(`${name}: ${g.result || 'bye'}. Type <span class="t">${name}</span> to play again.`); done();
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); return quit(); }
      if (over && (e.key === 'Enter' || e.key === ' ' || e.key === 'r')) { e.preventDefault(); return start(); }
      if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
      if (!over && g.key) g.key(e);
    }
    document.addEventListener('keydown', onKey, true);
    let t0;
    wrap.addEventListener('touchstart', e => { t0 = e.touches[0]; }, { passive: true });
    wrap.addEventListener('touchend', e => {
      if (e.target.closest('button') || !t0) return;
      e.preventDefault();
      const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
      if (over) return start();
      if (Math.hypot(dx, dy) < 20) g.tap && g.tap(); else g.swipe && g.swipe(dx, dy);
    });
    c.onclick = () => { if (over) start(); else g.tap && g.tap(); };
    start();
  });
}

function snakeGame(g) {
  const N = 20, { x, u, C } = g;
  let best = 0; try { best = +localStorage.getItem('snake') || 0; } catch (e) {}
  let body = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }], dir = { x: 1, y: 0 }, next = dir, score = 0;
  const spawn = () => { let p; do { p = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; } while (body.some(b => b.x === p.x && b.y === p.y)); return p; };
  let food = spawn();
  const draw = () => {
    x.fillStyle = C.bg; x.fillRect(0, 0, g.W, g.H);
    x.fillStyle = C.gold; x.fillRect(food.x * u + 2, food.y * u + 2, u - 4, u - 4);
    body.forEach((b, i) => { x.fillStyle = i ? C.fg : '#fff'; x.fillRect(b.x * u + 1, b.y * u + 1, u - 2, u - 2); });
    g.info(`score ${score}   best ${best}`);
  };
  const turn = (a, b) => { if (a !== -dir.x || b !== -dir.y) next = { x: a, y: b }; };
  g.key = e => { const k = DIRS[e.key] || DIRS[e.key.toLowerCase()]; if (k) turn(k[0], k[1]); };
  g.swipe = (dx, dy) => { if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1); };
  g.loop(110, () => {
    dir = next;
    const h = { x: body[0].x + dir.x, y: body[0].y + dir.y };
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some(b => b.x === h.x && b.y === h.y)) {
      if (score > best) { best = score; try { localStorage.setItem('snake', best); } catch (e) {} }
      g.result = `scored ${score}`; draw(); return g.end(`score ${score}   best ${best}`);
    }
    body.unshift(h);
    if (h.x === food.x && h.y === food.y) { score++; food = spawn(); } else body.pop();
    draw();
  });
  draw();
}

function dinoGame(g) {
  const { x, u, C, W, H } = g, gy = H - 2 * u;
  let best = 0; try { best = +localStorage.getItem('run') || 0; } catch (e) {}
  let y = 0, vy = 0, score = 0, obs = [{ x: W + u * 4, w: u, h: u * 1.6 }];
  const jump = () => { if (y === 0) vy = u * .95; };
  g.key = e => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') jump(); };
  g.tap = g.swipe = jump;
  g.loop(30, () => {
    vy -= u * .08; y += vy; if (y <= 0) { y = 0; vy = 0; }
    const spd = u * (.3 + score / 1500);
    obs.forEach(o => { o.x -= spd; });
    if (obs[0].x < -2 * u) obs.shift();
    if (obs[obs.length - 1].x < W - u * (9 + Math.random() * 8)) obs.push({ x: W + u, w: u * (.8 + Math.random() * .6), h: u * (1.2 + Math.random() * 1.2) });
    score++;
    x.fillStyle = C.bg; x.fillRect(0, 0, W, H);
    x.fillStyle = C.dim; x.fillRect(0, gy, W, 2);
    x.fillStyle = C.gold; obs.forEach(o => x.fillRect(o.x, gy - o.h, o.w, o.h));
    x.fillStyle = C.fg; x.fillRect(3 * u, gy - y - 1.2 * u, u, 1.2 * u);
    x.fillStyle = '#fff'; x.fillRect(3.6 * u, gy - y - 1.0 * u, u * .22, u * .22);
    g.info(`score ${Math.floor(score / 5)}   best ${best}`);
    if (obs.some(o => o.x < 4 * u && o.x + o.w > 3 * u && y < o.h - u * .2)) {
      const sc = Math.floor(score / 5);
      if (sc > best) { best = sc; try { localStorage.setItem('run', best); } catch (e) {} }
      g.result = `scored ${sc}`; g.end(`score ${sc}   best ${best}`);
    }
  });
}

const KON = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
let ki = 0;
document.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  ki = k === KON[ki] ? ki + 1 : (k === KON[0] ? 1 : 0);
  if (ki === KON.length) { ki = 0; print('<span class="y">+30 lives.</span> Cheat code accepted.'); }
});

      const CH = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789';

const names = Object.keys(CMDS);
const hist = []; let hi = 0; let busy = false;

// prompt row
const row = document.createElement('div');
row.id = 'row';
row.innerHTML = '<label for="in"><span class="pf">visitor@webs:</span>~$</label><input id="in" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Command">';
term.appendChild(row);
const input = row.querySelector('input');

async function run(raw) {
  const cmd = raw.trim().toLowerCase();
  if (!cmd) return;
  hist.push(cmd); hi = hist.length;
  const echo = print('<span class="t"><span class="pf">visitor@webs:</span>~$</span> ');
  echo.appendChild(document.createTextNode(raw));
  busy = true; input.readOnly = true;
  try {
    if (mode) { await mode(raw.trim()); return; }
    const [head, ...rest] = raw.trim().split(/\s+/);
    const name = head.toLowerCase();
    if (Object.hasOwn(CMDS, cmd)) await CMDS[cmd]();
    else if (Object.hasOwn(CMDS, name)) await CMDS[name](rest.join(' '));
    else print(`command not found: <span class="r"></span>. Type <span class="t">help</span>.`).querySelector('.r').textContent = cmd;
  } finally {
    busy = false; input.readOnly = false; if (!matchMedia('(pointer:coarse)').matches) input.focus();
    term.scrollTop = term.scrollHeight;
  }
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const v = input.value; input.value = ''; run(v); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (hi > 0) input.value = hist[--hi]; }
  else if (e.key === 'ArrowDown') { e.preventDefault(); hi = Math.min(hi + 1, hist.length); input.value = hist[hi] || ''; }
  else if (e.key === 'Tab') {
    e.preventDefault();
    const m = names.filter(n => n.startsWith(input.value.toLowerCase()));
    if (m.length === 1) input.value = m[0];
  } else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); CMDS.clear(); }
});

['help', 'about', 'projects', 'pricing', 'contact', 'games', 'snake', 'run', 'roulette', 'matrix', 'theme', 'neofetch', 'exit'].forEach(n => {
  const b = document.createElement('button');
  b.textContent = n;
  b.onclick = () => { if (!busy) run(n); };
  chips.appendChild(b);
});
term.addEventListener('click', e => { if (!getSelection().toString() && e.target.tagName !== 'A') input.focus(); });

try { const t = localStorage.getItem('theme'); if (t) { CMDS.theme(t); [...term.querySelectorAll('.line')].pop().remove(); } } catch (e) {}
print('<span class="y">Yatharth Webs</span> terminal. Type <span class="t">help</span> for a lot more commands, or hit <span class="t">roulette</span> to get something to build.');
if (!matchMedia('(pointer:coarse)').matches) input.focus();
